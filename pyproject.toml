[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maria-core"
version = "0.1.0"
description = "Socle de MARIA : un processus, des extensions, une base."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.4,<3",
    "openai>=1.40,<3",
    "typesafe-sdk>=0.1",
    "python-dotenv>=1.0,<2",
    "chromadb>=1.0,<2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8",
]

[project.scripts]
maria = "maria_core.__main__:main"

[tool.setuptools.packages.find]
include = ["maria_core*"]

[tool.setuptools.package-data]
maria_core = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "RUF", "PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["maria_core", "tests"]
known-third-party = ["discord"]
